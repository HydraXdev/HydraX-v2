name: BITTEN UI QA Pipeline

on:
  push:
    paths:
      - "bitten-ui/**"
  pull_request:
    paths:
      - "bitten-ui/**"

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bitten-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: bitten-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Build application
        run: npm run build

      - name: Start application for testing
        run: |
          npm run start &
          sleep 10
        env:
          CI: true

      - name: Run route smoke tests
        run: npm run smoke

      - name: Health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/healthz)
          if [ $response -eq 200 ]; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed with status $response"
            exit 1
          fi

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bitten-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: bitten-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Check bundle size
        run: |
          echo "📦 Build output:"
          du -sh .next/ || echo "Build directory not found"
          echo "📊 Chunk analysis:"
          find .next -name "*.js" -type f -exec ls -lh {} \; | head -10 || echo "No JS files found"
